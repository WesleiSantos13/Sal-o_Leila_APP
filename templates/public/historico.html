<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Histórico | Salão Santana</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    
    <header class="page-header">
        <h1>Meus Agendamentos</h1>
        <p class="subtitle">Digite seu e-mail para consultar seu histórico ou reagendar um horário.</p>
    </header>

    <!-- Formulário de Busca -->
    <form id="buscaForm" class="caixa-busca">
        <input 
            type="email" 
            id="emailBusca" 
            placeholder="exemplo@email.com" 
            required
        >
        <button type="submit" class="btn-confirmar btn-buscar">
            Buscar
        </button>
    </form>

    <!-- Painel Oculto para Escolher Nova Data -->
    <div id="formEdicaoData" class="painel-edicao" style="display: none;">
        
        <h3>Alterar Data do Agendamento</h3>
        <div class="form-group">
            <input type="datetime-local" id="novaData" required>
        </div>
        <div class="botoes-edicao">
            <button class="btn-confirmar" onclick="salvarNovaData()">Confirmar Nova Data</button>
            <button class="btn-nav btn-nav-voltar" onclick="fecharEdicao()">Cancelar</button>
        </div>
    </div>

    <hr class="divider">

    <section class="lista-section">
        <ul id="listaHistorico" class="item-list"></ul>
    </section>

    <!-- Botão de Voltar na parte inferior -->
    <div class="botoes-form" style="margin-top: 32px;">
        <a href="/" class="btn-nav btn-nav-voltar">
            ⬅ Voltar ao Início
        </a>
    </div>

</div>

<script>
const buscaForm = document.getElementById("buscaForm");
const lista = document.getElementById("listaHistorico");
const formEdicaoData = document.getElementById("formEdicaoData");

let agendamentoEditandoId = null;
let mapaServicos = {};

// 1. CARREGAR MAPA DE SERVIÇOS (Para mostrar os nomes)
async function carregarServicos() {
    try {
        const resposta = await fetch("/servicos");
        const servicos = await resposta.json();
        for (let servico of servicos) {
            mapaServicos[servico.id] = servico.nome;
        }
    } catch (erro) {
        console.error("Erro ao carregar serviços:", erro);
    }
}

// 2. BUSCAR HISTÓRICO DO CLIENTE
buscaForm.addEventListener("submit", async function(evento) {
    evento.preventDefault();
    const email = document.getElementById("emailBusca").value;
    
    lista.innerHTML = "<p class='status-msg'>Buscando agendamentos...</p>";

    try {
        const resposta = await fetch(`/api/historico?email=${email}`);
        
        if (!resposta.ok) {
            lista.innerHTML = "<p class='mensagem-erro' style='display:block;'>Cliente não encontrado ou sem agendamentos ativos.</p>";
            return;
        }

        const agendamentos = await resposta.json();
        lista.innerHTML = "";

        const dataAtual = new Date();

        for (let agendamento of agendamentos) {
            let nomeServico = mapaServicos[agendamento.servico_id] || "Serviço do Salão";
            let dataAgendamento = new Date(agendamento.data_hora);
            
            // Diferença em horas entre o agendamento e o momento atual
            let diferencaHoras = (dataAgendamento - dataAtual) / (1000 * 60 * 60);

            let botoesHTML = "";

            // Se faltar MAIS de 48h, permite alterar pelo sistema
            if (diferencaHoras > 48 && agendamento.status !== "Serviço Realizado") {
                botoesHTML = `
                    <button class="btn-editar-data" onclick="abrirEdicao(${agendamento.id})">
                        📅 Alterar Data
                    </button>
                `;
            } 
            // Se faltar MENOS de 48h, orienta a ligar no salão
            else if (diferencaHoras > 0 && diferencaHoras <= 48 && agendamento.status !== "Serviço Realizado") {
                botoesHTML = `<p class="aviso-telefone">⚠️ Faltam menos de 48h. Para reagendar, entre em contato com nosso atendimento pelo telefone.</p>`;
            }

            // Cores sofisticadas para o status no Dark Mode
            let corStatus = '#a0a0a0'; // Agendado
            if (agendamento.status === 'Confirmado') corStatus = '#d4af37'; // Dourado
            if (agendamento.status === 'Serviço Realizado') corStatus = '#4caf50'; // Verde discreto

            lista.innerHTML += `
                <li class="card-item">
                    <div class="item-info">
                        <strong>Data/Hora:</strong> ${agendamento.data_hora.replace("T", " às ")} <br>
                        <strong>Serviço:</strong> ${nomeServico} <br>
                        <strong>Status:</strong> <span style="font-weight: 600; color: ${corStatus}">${agendamento.status}</span>
                    </div>
                    <div class="item-actions">
                        ${botoesHTML}
                    </div>
                </li>
            `;
        }
    } catch (erro) {
        lista.innerHTML = "<p class='mensagem-erro' style='display:block;'>Erro ao buscar histórico. Tente novamente.</p>";
    }
});

// 3. FUNÇÕES PARA ALTERAR A DATA
function abrirEdicao(id) {
    agendamentoEditandoId = id;
    formEdicaoData.style.display = "block";
    formEdicaoData.scrollIntoView({ behavior: "smooth" });
}

function fecharEdicao() {
    agendamentoEditandoId = null;
    formEdicaoData.style.display = "none";
}

async function salvarNovaData() {
    const novaData = document.getElementById("novaData").value;
    
    if(!novaData) {
        alert("Escolha uma data e horário válidos!");
        return;
    }

    try {
        await fetch(`/agendamentos/${agendamentoEditandoId}/data`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ data_hora: novaData })
        });

        alert("Data atualizada com sucesso!");
        fecharEdicao();
        
        // Simula clique no botão para atualizar a lista automaticamente
        document.querySelector("#buscaForm button").click(); 
    } catch (erro) {
        alert("Erro ao tentar alterar a data.");
    }
}

// Inicializa carregando o mapa de serviços
carregarServicos();
</script>

</body>
</html>
