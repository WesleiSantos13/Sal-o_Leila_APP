<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Horário — Salão Santana</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Puxando os estilos centralizados -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <div class="botoes-topo">
        <a href="/" class="btn-nav btn-nav-voltar">⬅ Voltar</a>
        <a href="/meu-historico" class="btn-nav btn-nav-historico">📅 Meu Histórico</a>
    </div>

    <header>
        <h1>Agendar Horário</h1>
        <p class="subtitulo">Escolha um ou mais serviços para o seu atendimento.</p>
    </header>

    <form id="agendamentoForm">

        <input type="text" id="nome" placeholder="Seu nome completo" required>
        <input type="tel" id="telefone" placeholder="Seu telefone (WhatsApp)" required>
        <input type="email" id="email" placeholder="Seu melhor e-mail" required>

        <div id="lista_servicos" class="caixa-servicos">
            <p style="color: var(--cor-subtexto); font-size: 0.9rem;">Carregando serviços disponíveis...</p>
        </div>

        <input type="datetime-local" id="data_hora" required>

        <button type="submit" id="btnAgendar" class="btn-confirmar">
            Confirmar Agendamento
        </button>

    </form>

</div>

<script>
const form = document.getElementById("agendamentoForm");
const containerServicos = document.getElementById("lista_servicos");
const btnAgendar = document.getElementById("btnAgendar");

// 1. CARREGAR SERVIÇOS
async function carregarServicos() {
    try {
        const resposta = await fetch("/servicos");
        const servicos = await resposta.json();
        containerServicos.innerHTML = ""; 

        for (let servico of servicos) {
            containerServicos.innerHTML += `
                <label>
                    <input type="checkbox" name="servicos_selecionados" value="${servico.id}">
                    <span>${servico.nome} — <strong>R$ ${servico.preco.toFixed(2)}</strong></span>
                </label>
            `;
        }
    } catch (erro) {
        containerServicos.innerHTML = '<p style="color: #ff6b6b; font-size: 0.9rem;">Erro ao carregar serviços.</p>';
    }
}

// 2. FUNÇÃO PARA VERIFICAR SE JÁ TEM AGENDAMENTO NA SEMANA
async function sugerirAgrupamento(email, dataEscolhida) {
    try {
        const resposta = await fetch(`/api/historico?email=${email}`);
        
        if (!resposta.ok) return dataEscolhida; // Se não tem histórico, devolve a data normal
        
        const agendamentos = await resposta.json();
        const dEscolhida = new Date(dataEscolhida);
        const hoje = new Date();

        for (let ag of agendamentos) {
            const dAgendamento = new Date(ag.data_hora);
            
            // Só olha para agendamentos no futuro que não foram concluídos
            if (dAgendamento > hoje && ag.status !== "Serviço Realizado") {
                
                // Calcula a diferença de dias entre a data que ela escolheu agora e a que ela já tinha marcado
                const diffTempo = Math.abs(dEscolhida - dAgendamento); 
                const diffDias = diffTempo / (1000 * 60 * 60 * 24); 
                
                // Se for na mesma semana (diferença menor que 6 dias) mas em um horário/dia diferente
                if (diffDias <= 6 && dEscolhida.getTime() !== dAgendamento.getTime()) {
                    const dataFormatada = ag.data_hora.replace("T", " às ");    
                    // Faz a pergunta para a cliente
                    const querAgrupar = confirm(`✨ Dica do Salão:\n\nIdentificamos que você já tem um horário conosco para o dia ${dataFormatada}.\n\nGostaria de agendar este novo serviço para a mesma data e horário para aproveitar a viagem?`);
                    if (querAgrupar) {
                        return ag.data_hora; // Se ela disser SIM, trocamos a data
                    }
                    break; // Se ela disser NÃO, paramos de perguntar
                }
            }
        }
        return dataEscolhida;
    } catch (erro) {
        return dataEscolhida; // Em caso de erro na rede, segue o fluxo normal
    }
}

// 3. ENVIAR FORMULÁRIO
form.addEventListener("submit", async function(evento) {
    evento.preventDefault(); // Impede que a página recarregue do zero

    const checkboxesMarcadas = document.querySelectorAll('input[name="servicos_selecionados"]:checked');
    const servicosIds = []; 

    for (let checkbox of checkboxesMarcadas) {
        servicosIds.push(checkbox.value); 
    }

    if (servicosIds.length === 0) {
        alert("Por favor, selecione pelo menos um serviço!");
        return;
    }

    const textoOriginalBotao = btnAgendar.innerText;
    btnAgendar.innerText = "Aguarde, agendando...";
    btnAgendar.disabled = true;

    try {
        const email = document.getElementById("email").value;
        const dataHoraOriginal = document.getElementById("data_hora").value;

        // CHAMA A FUNCAO DE AGRUPAMENTO ANTES DE SALVAR!
        const dataFinal = await sugerirAgrupamento(email, dataHoraOriginal);

        // Cria/Busca Cliente
        const respostaCliente = await fetch("/clientes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nome: document.getElementById("nome").value,
                telefone: document.getElementById("telefone").value,
                email: email
            })
        });
        const cliente = await respostaCliente.json();

        // Cria os Agendamentos enviando a dataFinal (que pode ter sido alterada pela sugestão)
        await fetch("/agendamentos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                data_hora: dataFinal,
                cliente_id: cliente.id,
                servicos_ids: servicosIds, 
                status: "Agendado"
            })
        });

        alert("🎉 Agendamento realizado com sucesso! Te esperamos no salão.");
        form.reset();

    } catch (erro) {
        alert("Erro ao agendar. Tente novamente.");
    } finally {
        btnAgendar.innerText = textoOriginalBotao;
        btnAgendar.disabled = false;
    }
});

carregarServicos();
</script>

</body>
</html>
