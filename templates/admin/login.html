<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Salão Santana</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <header class="page-header">
        <h1>Área Administrativa</h1>
        <p class="subtitle">Acesso restrito. Insira suas credenciais.</p>
    </header>

    <form id="loginForm">

        <div class="form-group">
            <input
                type="text"
                id="usuario"
                placeholder="Usuário"
                required
                autocomplete="username"
            >
        </div>

        <div class="form-group">
            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
                autocomplete="current-password"
            >
        </div>

        <!-- Botão principal padronizado com .btn-confirmar (Dourado) -->
        <button type="submit" id="btnEntrar" class="btn-confirmar">
            Entrar no Painel
        </button>

        <!-- Botão de voltar padronizado com as classes da barra de navegação -->
        <a href="/" class="btn-nav btn-nav-voltar" style="margin-top: 8px;">
            ⬅ Voltar ao Início
        </a>

        <!-- Mensagem de erro -->
        <p id="mensagemErro" class="mensagem-erro">Usuário ou senha inválidos!</p>

    </form>

</div>

<script>
const form = document.getElementById("loginForm");
const btnEntrar = document.getElementById("btnEntrar");
const mensagemErro = document.getElementById("mensagemErro");

form.addEventListener("submit", async function(evento) {
    evento.preventDefault();

    const usuario = document.getElementById("usuario").value.trim();
    const senha = document.getElementById("senha").value;

    // 1. Feedback visual: desativa o botão enquanto consulta o servidor
    const textoOriginal = btnEntrar.innerText;
    btnEntrar.innerText = "Verificando...";
    btnEntrar.disabled = true;
    mensagemErro.style.display = "none";

    try {
        // 2. Envia os dados de forma segura para o servidor (Backend)
        const resposta = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                usuario: usuario,
                senha: senha
            })
        });

        // 3. Verifica a resposta do servidor
        if (resposta.ok) {
            // Login autorizado pelo servidor! Redireciona para o painel
            window.location.href = "/admin/dashboard";
        } else {
            // Erro de autenticação (401 Não Autorizado ou 400)
            const dadosErro = await resposta.json().catch(() => null);
            mensagemErro.innerText = (dadosErro && dadosErro.erro) ? dadosErro.erro : "Usuário ou senha inválidos!";
            mensagemErro.style.display = "block";
        }

    } catch (erro) {
        // Erro de conexão com o servidor
        mensagemErro.innerText = "Erro de conexão com o servidor. Tente novamente.";
        mensagemErro.style.display = "block";
    } finally {
        // 4. Reativa o botão em caso de erro para tentar de novo
        btnEntrar.innerText = textoOriginal;
        btnEntrar.disabled = false;
    }
});
</script>

</body>
</html>
