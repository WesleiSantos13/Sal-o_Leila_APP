<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Salão Leila</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <header class="page-header">
        <h1>Área Administrativa</h1>
        <p class="subtitle">Acesso restrito. Insira suas credenciais.</p>
    </header>

    <form id="loginForm">

        <div class="form-group">
            <input
                type="text"
                id="usuario"
                placeholder="Usuário"
                required
            >
        </div>

        <div class="form-group">
            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
            >
        </div>

        <!-- Botão principal padronizado com .btn-confirmar (Dourado) -->
        <button type="submit" class="btn-confirmar">
            Entrar no Painel
        </button>

        <!-- Botão de voltar padronizado com as classes da barra de navegação -->
        <a href="/" class="btn-nav btn-nav-voltar" style="margin-top: 8px;">
            ⬅ Voltar ao Início
        </a>

        <!-- Mensagem de erro -->
        <p id="mensagemErro" class="mensagem-erro">Usuário ou senha inválidos!</p>

    </form>

</div>

<script>
const form = document.getElementById("loginForm");
const mensagemErro = document.getElementById("mensagemErro");

form.addEventListener("submit", function(evento) {
    evento.preventDefault();

    const usuario = document.getElementById("usuario").value;
    const senha = document.getElementById("senha").value;

    // LÓGICA DE LOGIN
    if (usuario === "admin" && senha === "123") {
        window.location.href = "/admin/dashboard";
    } else {
        mensagemErro.style.display = "block";
        
        setTimeout(() => {
            mensagemErro.style.display = "none";
        }, 3000);
    }
});
</script>

</body>
</html>
