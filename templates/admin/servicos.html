<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Serviços</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <header class="page-header">
        <h1>Gerenciar Serviços</h1>
        <p class="subtitle">Cadastre, edite ou remova os serviços oferecidos no Salão Leila.</p>
    </header>

    <!-- Formulário de Cadastro / Edição -->
    <form id="servicoForm" class="form-grid">

        <div class="form-group">
            <input
                type="text"
                id="nome"
                placeholder="Nome do Serviço (ex: Corte Masculino)"
                required
            >
        </div>

        <div class="form-group">
            <input
                type="number"
                id="preco"
                step="0.01"
                placeholder="Preço (R$)"
                required
            >
        </div>

        <div class="form-group">
            <input
                type="number"
                id="duracao"
                placeholder="Duração (em minutos)"
                required
            >
        </div>

        <div class="botoes-form">
            <button type="submit" id="btnSalvar" class="btn-confirmar">
                Cadastrar Serviço
            </button>

            <a href="/admin/dashboard" class="btn-nav btn-nav-voltar" style="margin-top: 8px;">
                ⬅ Voltar ao Painel
            </a> 
        </div>

    </form>

    <hr class="divider">

    <section class="lista-section">
        <h2>Lista de Serviços</h2>
        <ul id="listaServicos" class="item-list"></ul>
    </section>

</div>

<script>
const form = document.getElementById("servicoForm");
const lista = document.getElementById("listaServicos");
const btnSalvar = document.getElementById("btnSalvar");
let editandoId = null;

// 1. LISTAR SERVIÇOS
async function carregarServicos() {
    try {
        const resposta = await fetch("/servicos"); 
        const servicos = await resposta.json();

        lista.innerHTML = "";

        if (servicos.length === 0) {
            lista.innerHTML = "<p class='status-msg'>Nenhum serviço cadastrado ainda.</p>";
            return;
        }

        for (let servico of servicos) {
            lista.innerHTML += `
                <li class="card-item">
                    <div class="item-info">
                        <strong>${servico.nome}</strong> <br>
                        💰 R$ ${parseFloat(servico.preco).toFixed(2)} &nbsp;|&nbsp; ⏱️ ${servico.duracao} min
                    </div>
                    <div class="item-actions">
                        <button class="btn-editar-data" onclick="editarServico(${servico.id}, '${servico.nome}', ${servico.preco}, ${servico.duracao})">
                            ✏️ Editar
                        </button>
                        <button class="btn-editar-data" onclick="deletarServico(${servico.id})">
                            🗑 Excluir
                        </button>
                    </div>
                </li>
            `;
        }
    } catch (erro) {
        lista.innerHTML = "<p class='mensagem-erro' style='display:block;'>Erro ao carregar a lista de serviços.</p>";
    }
}

// 2. SALVAR OU EDITAR SERVIÇO
form.addEventListener("submit", async function(evento) {
    evento.preventDefault();

    const nome = document.getElementById("nome").value;
    const preco = document.getElementById("preco").value;
    const duracao = document.getElementById("duracao").value;

    const dadosDoServico = {
        nome: nome,
        preco: preco,
        duracao: duracao
    };

    if (editandoId) {
        // EDITAR (PUT)
        const resposta = await fetch(`/servicos/${editandoId}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(dadosDoServico)
        });
        
        const dados = await resposta.json();
        
        if (resposta.status == 400) {
            alert("⚠️ " + dados.erro);
        } else {
            alert("✨ " + dados.mensagem);
        }
        
        editandoId = null; // Reseta a variável após editar
        btnSalvar.innerText = "Cadastrar Serviço"; // Retorna o texto original do botão
        
    } else {
        // CRIAR (POST)
        await fetch("/servicos", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(dadosDoServico)
        });
        alert("✨ Serviço cadastrado com sucesso!");
    }

    form.reset(); // Limpa os campos
    carregarServicos(); // Atualiza a lista
});

// 3. DELETAR SERVIÇO
async function deletarServico(id) {
    if (confirm("Tem certeza que deseja apagar este serviço?")) {
        const resposta = await fetch(`/servicos/${id}`, {
            method: "DELETE"
        });
        
        const dados = await resposta.json();

        if (resposta.status == 400) {
            alert("⚠️ " + dados.erro);
        } else {
            carregarServicos(); // Atualiza a lista 
            alert("🗑️ " + dados.mensagem); 
        }
    }
}

// 4. PREPARAR PARA EDITAR
function editarServico(id, nome, preco, duracao) {
    editandoId = id; // Salva o ID que estamos editando
    
    // Preenche o formulário com os dados atuais
    document.getElementById("nome").value = nome;
    document.getElementById("preco").value = preco;
    document.getElementById("duracao").value = duracao;

    // Altera o texto do botão principal para indicar modo de edição
    btnSalvar.innerText = "Salvar Alterações";

    // Rola a página suavemente de volta ao topo para o usuário ver o formulário
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// INICIALIZAÇÃO: Executa ao abrir a página
carregarServicos();
</script>

</body>
</html>
