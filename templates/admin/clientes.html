<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Clientes | Salão Santana</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">

        <header class="page-header">
            <h1>Gerenciar Clientes</h1>
            <p class="subtitle">Cadastre novos clientes ou consulte a base de dados do Salão Leila.</p>
        </header>

        <!-- Formulário de Cadastro -->
        <form id="clienteForm" class="form-grid">
            <div class="form-group">
                <input
                    type="text"
                    id="nome"
                    placeholder="Nome completo"
                    required
                >
            </div>

            <div class="form-group">
                <input
                    type="text"
                    id="telefone"
                    placeholder="Telefone / WhatsApp"
                    required
                >
            </div>

            <div class="form-group">
                <input
                    type="email"
                    id="email"
                    placeholder="E-mail"
                    required
                >
            </div>

            <div class="botoes-form">
                <button type="submit" id="btnSalvar" class="btn-confirmar">
                    Cadastrar Cliente
                </button>

                <a href="/admin/dashboard" class="btn-nav btn-nav-voltar" style="margin-top: 8px;">
                    ⬅ Voltar ao Painel
                </a> 
            </div>
        </form>

        <hr class="divider">

        <section class="lista-section">
            <h2>Lista de Clientes</h2>
            <ul id="listaClientes" class="item-list"></ul>
        </section>

    </div>

    <script>
        const form = document.getElementById("clienteForm");
        const lista = document.getElementById("listaClientes");

        // 1. LISTAR CLIENTES (Atualizado com layout de cards do Dark Mode)
        async function carregarClientes() {
            try {
                const resposta = await fetch("/clientes");
                const clientes = await resposta.json();

                lista.innerHTML = "";

                if (clientes.length === 0) {
                    lista.innerHTML = "<p class='status-msg'>Nenhum cliente cadastrado ainda.</p>";
                    return;
                }

                for (let cliente of clientes) {
                    lista.innerHTML += `
                        <li class="card-item">
                            <div class="item-info">
                                <strong>${cliente.nome}</strong> <br>
                                📞 ${cliente.telefone} &nbsp;|&nbsp; ✉️ ${cliente.email}
                            </div>
                            <div class="item-actions">
                                <button class="btn-editar-data" onclick="deletarCliente(${cliente.id})">
                                    🗑 Apagar
                                </button>
                            </div>
                        </li>
                    `;
                }
            } catch (erro) {
                lista.innerHTML = "<p class='mensagem-erro' style='display:block;'>Erro ao carregar a lista de clientes.</p>";
            }
        }

        // 2. APAGAR CLIENTE PELA ADMIN
        async function deletarCliente(id) {
            if (confirm("Tem certeza que deseja apagar este cliente?")) {
                const resposta = await fetch(`/clientes/${id}`, {
                    method: "DELETE"
                });

                // Se a resposta NÃO for ok (Ex: deu erro 400 porque tem agendamento)
                if (!resposta.ok) {
                    const dadosErro = await resposta.json();
                    alert("⚠️ " + dadosErro.erro); // Mostra o erro do Python na tela
                } else {
                    carregarClientes(); // Atualiza a lista se der certo
                }
            }
        }

        // 3. CADASTRAR CLIENTE PELA ADMIN
        form.addEventListener("submit", async function(evento) {
            evento.preventDefault();

            const nome = document.getElementById("nome").value;
            const telefone = document.getElementById("telefone").value;
            const email = document.getElementById("email").value;

            try {
                const resposta = await fetch("/clientes", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nome: nome,
                        telefone: telefone,
                        email: email
                    })
                });

                const dados = await resposta.json();
                alert(dados.mensagem);
                form.reset(); // Limpa os campos do formulário
                carregarClientes(); // Atualiza a lista
            } catch (erro) {
                alert("Erro ao tentar cadastrar cliente.");
            }
        });

        // INICIALIZAÇÃO: Executa ao abrir a página
        carregarClientes();
    </script>

</body>
</html>
