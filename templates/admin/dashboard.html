<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Salão Santana</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container" style="max-width: 1000px;"> 

        <!-- Cabeçalho do Painel -->
        <header class="cabecalho-dashboard">
            <div>
                <h1>✨ Desempenho do Negócio</h1>
                <p id="textoSemana" class="subtitle">Carregando dados da semana...</p>
            </div>
            <a href="/admin" class="btn-nav btn-nav-voltar" style="width: auto; padding: 10px 20px;">
                ⬅ Sair
            </a>
        </header>

        <!-- Menu de Navegação Administrativa -->
        <nav class="botoes-topo menu-admin">
            <a href="/admin/clientes" class="btn-nav btn-nav-historico">👥 Clientes</a>
            <a href="/admin/servicos" class="btn-nav btn-nav-historico">💇‍♀️ Serviços</a>
            <a href="/admin/agendamentos" class="btn-nav btn-nav-historico">📅 Agendamentos</a>
        </nav>

        <!-- Grid de Cards de Métricas -->
        <section class="cards-grid">
            <div class="card-metric card-clientes">
                <h2>Total de Clientes</h2>
                <p id="totalClientes">...</p> 
            </div>

            <div class="card-metric card-agendamentos">
                <h2>Agendados na Semana</h2>
                <p id="totalAgendamentos">...</p>
            </div>

            <div class="card-metric card-concluidos">
                <h2>Concluídos na Semana</h2>
                <p id="totalConcluidos">...</p>
            </div>

            <div class="card-metric card-faturamento">
                <h2>Faturamento Semanal</h2>
                <p id="faturamentoSemana">...</p>
            </div>
        </section>

    </div>

<script>
// Função auxiliar para verificar se uma data está na mesma semana de hoje
function ehDaMesmaSemana(dataDesejada) {
    const hoje = new Date();
    // Ajusta para o domingo da semana atual (início da semana)
    const primeiroDia = new Date(hoje.setDate(hoje.getDate() - hoje.getDay()));
    primeiroDia.setHours(0, 0, 0, 0);
    
    // Ajusta para o sábado da semana atual (fim da semana)
    const ultimoDia = new Date(primeiroDia);
    ultimoDia.setDate(primeiroDia.getDate() + 6);
    ultimoDia.setHours(23, 59, 59, 999);

    const dataTestada = new Date(dataDesejada);
    return dataTestada >= primeiroDia && dataTestada <= ultimoDia;
}

// Mostra a qual semana estamos nos referindo no topo da tela
function atualizarTextoSemana() {
    const hoje = new Date();
    const primeiroDia = new Date(hoje.setDate(hoje.getDate() - hoje.getDay()));
    const ultimoDia = new Date(primeiroDia);
    ultimoDia.setDate(primeiroDia.getDate() + 6);

    const formatar = (data) => data.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    document.getElementById('textoSemana').innerText = `Semana atual: ${formatar(primeiroDia)} a ${formatar(ultimoDia)}`;
}

async function carregarDashboard() {
    atualizarTextoSemana();

    try {
        const [respostaClientes, respostaServicos, respostaAgendamentos] = await Promise.all([
            fetch('/clientes'),
            fetch('/servicos'),
            fetch('/agendamentos')
        ]);

        const clientesJson = await respostaClientes.json();
        const servicosJson = await respostaServicos.json();
        const agendamentosJson = await respostaAgendamentos.json();

        // Cria um "dicionário" de preços de serviços para calcular o faturamento depois
        let precosServicos = {};
        for (let servico of servicosJson) {
            precosServicos[servico.id] = servico.preco;
        }

        // Variáveis para contar o desempenho da semana
        let agendamentosDaSemana = 0;
        let concluidosDaSemana = 0;
        let dinheiroDaSemana = 0;

        // Analisa cada agendamento
        for (let agendamento of agendamentosJson) {
            // Se for dessa semana, conta!
            if (ehDaMesmaSemana(agendamento.data_hora)) {
                agendamentosDaSemana++;

                // Se além de ser dessa semana, ele já estiver pago/concluído...
                if (agendamento.status === 'Serviço Realizado') {
                    concluidosDaSemana++;
                    dinheiroDaSemana += precosServicos[agendamento.servico_id]; // Soma o preço do serviço
                }
            }
        }

        // Atualiza a tela
        document.getElementById('totalClientes').innerText = clientesJson.length;
        document.getElementById('totalAgendamentos').innerText = agendamentosDaSemana;
        document.getElementById('totalConcluidos').innerText = concluidosDaSemana;
        
        // Formata o dinheiro para R$
        document.getElementById('faturamentoSemana').innerText = `R$ ${dinheiroDaSemana.toFixed(2).replace('.', ',')}`;

    } catch (erro) {
        console.error("Erro:", erro);
        document.getElementById('totalClientes').innerText = "Erro";
        document.getElementById('totalAgendamentos').innerText = "Erro";
        document.getElementById('totalConcluidos').innerText = "Erro";
        document.getElementById('faturamentoSemana').innerText = "Erro";
    }
}

carregarDashboard();
</script>

</body>
</html>
